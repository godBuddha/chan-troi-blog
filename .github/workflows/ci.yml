# CI: kiểm tra mỗi lần push / pull request
# 1) build web (y hệt Dockerfile production)  2) validate Caddyfile + compose
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/web
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: blog
          POSTGRES_PASSWORD: blog
          POSTGRES_DB: blog
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U blog"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URI: postgres://blog:blog@127.0.0.1:5432/blog
      PAYLOAD_SECRET: ci-secret-check-only
      MEDIA_DIR: ./media-ci
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/web/package-lock.json
      - run: npm ci
      - run: npm run build

  infra-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Caddyfile phải render được ở cả 2 chế độ: không domain (HTTP :80) và có domain (HTTPS)
      - name: Validate Caddyfile (không domain)
        run: docker run --rm -v "$PWD/app/caddy/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile
      - name: Validate Caddyfile (có domain + email)
        run: docker run --rm -e SITE_DOMAIN=blog.example.com -e ACME_EMAIL=ban@example.com -v "$PWD/app/caddy/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile
      - name: Validate docker compose
        run: |
          cd app
          printf 'POSTGRES_PASSWORD=ci\nDATABASE_URI=postgres://blog:ci@postgres:5432/blog\nPAYLOAD_SECRET=ci\n' > .env.ci
          docker compose --env-file .env.ci config -q
          rm .env.ci
